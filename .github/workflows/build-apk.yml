name: Build Smart Flashlight APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Extract Uploaded ZIP Automatically
        run: |
          echo "Searching for uploaded ZIP file..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP file: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d .
            echo "Extraction completed successfully!"
            ls -la
          else
            echo "Error: No ZIP file found in the repository!"
            exit 1
          fi

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 5. Compile and Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: 6. Upload Ready APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Flashlight-V2-APK
          path: app/build/outputs/apk/debug/*.apk
          
